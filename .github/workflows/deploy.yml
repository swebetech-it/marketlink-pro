name: Automated Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Swebetech Production Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST || secrets.HOST }}
          username: ${{ secrets.SERVER_USER || secrets.SSH_USERNAME || secrets.SSH_USER || 'root' }}
          key: ${{ secrets.SSH_PRIVATE_KEY || secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || secrets.PORT || 22 }}
          script_stop: true
          script: |
            echo "Starting deployment on server..."
            # Auto-detect application directory
            if [ -d "/var/www/linkora" ]; then
              cd /var/www/linkora
            elif [ -d "/var/www/marketlink-pro" ]; then
              cd /var/www/marketlink-pro
            else
              echo "Error: Application directory not found in /var/www/"
              exit 1
            fi

            # Execute deployment script
            bash server_config/deploy.sh
