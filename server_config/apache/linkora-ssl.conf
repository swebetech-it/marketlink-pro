# ==============================================================================
# Linkora Full Apache SSL Configuration (Port 443 HTTPS)
# Server: Swebetech-IT-Solutions
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. HTTP to HTTPS Automatic Redirects (Port 80)
# ------------------------------------------------------------------------------
<VirtualHost *:80>
    ServerName linkora.co.tz
    ServerAlias www.linkora.co.tz
    RewriteEngine On
    RewriteCond %{SERVER_NAME} =linkora.co.tz [OR]
    RewriteCond %{SERVER_NAME} =www.linkora.co.tz
    RewriteRule ^ https://linkora.co.tz%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<VirtualHost *:80>
    ServerName api.linkora.co.tz
    ServerAlias api.linkola.co.tz
    RewriteEngine On
    RewriteCond %{SERVER_NAME} =api.linkora.co.tz [OR]
    RewriteCond %{SERVER_NAME} =api.linkola.co.tz
    RewriteRule ^ https://api.linkora.co.tz%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

# ------------------------------------------------------------------------------
# 2. MAIN WEB & LANDING PAGE SSL (Port 443)
# ------------------------------------------------------------------------------
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName linkora.co.tz
    ServerAlias www.linkora.co.tz
    ServerAdmin admin@linkora.co.tz

    DocumentRoot /var/www/html/marketlink-pro/backend/public

    <Directory /var/www/html/marketlink-pro/backend/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Android APK Direct Download Setup
    <Directory /var/www/html/marketlink-pro/backend/public/downloads>
        Header set Content-Disposition "attachment; filename=\"linkora.apk\""
        Header set Content-Type "application/vnd.android.package-archive"
        Header set Cache-Control "no-cache, must-revalidate"
    </Directory>

    # Security Headers
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # SSL Certificates (Let's Encrypt)
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/linkora.co.tz/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/linkora.co.tz/privkey.pem
    IncludeOptional /etc/letsencrypt/options-ssl-apache.conf

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/linkora_web_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/linkora_web_ssl_access.log combined
</VirtualHost>

# ------------------------------------------------------------------------------
# 3. REST API GATEWAY SSL (Port 443)
# ------------------------------------------------------------------------------
<VirtualHost *:443>
    ServerName api.linkora.co.tz
    ServerAlias api.linkola.co.tz
    ServerAdmin admin@linkora.co.tz

    DocumentRoot /var/www/html/marketlink-pro/backend/public

    <Directory /var/www/html/marketlink-pro/backend/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # CORS Headers for Mobile Client & Portal
        Header always set Access-Control-Allow-Origin "*"
        Header always set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
        Header always set Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-User-Id"
        Header always set Access-Control-Expose-Headers "Content-Length,Content-Range"

        # Preflight OPTIONS Response
        RewriteEngine On
        RewriteCond %{REQUEST_METHOD} OPTIONS
        RewriteRule ^(.*)$ $1 [R=204,L]
    </Directory>

    # Security Headers
    Header always set X-Content-Type-Options "nosniff"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # SSL Certificates (Let's Encrypt)
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/linkora.co.tz/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/linkora.co.tz/privkey.pem
    IncludeOptional /etc/letsencrypt/options-ssl-apache.conf

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/linkora_api_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/linkora_api_ssl_access.log combined
</VirtualHost>
</IfModule>
