# ==============================================================================
# Linkora Apache Configuration (Base Port 80 for Initial Setup & Certbot)
# Server: Swebetech-IT-Solutions
# Path: /var/www/html/marketlink-pro/backend/public
# Domains:
#   - linkora.co.tz, www.linkora.co.tz (Landing Page & Admin Web Portal)
#   - api.linkora.co.tz, api.linkola.co.tz (API Gateway)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. MAIN WEB / LANDING PAGE: linkora.co.tz & www.linkora.co.tz
# ------------------------------------------------------------------------------
<VirtualHost *:80>
    ServerName linkora.co.tz
    ServerAlias www.linkora.co.tz
    ServerAdmin admin@linkora.co.tz

    DocumentRoot /var/www/html/marketlink-pro/backend/public

    <Directory /var/www/html/marketlink-pro/backend/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # APK Direct Downloads Header
    <Directory /var/www/html/marketlink-pro/backend/public/downloads>
        Header set Content-Disposition "attachment; filename=\"linkora.apk\""
        Header set Content-Type "application/vnd.android.package-archive"
        Header set Cache-Control "no-cache, must-revalidate"
    </Directory>

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/linkora_web_error.log
    CustomLog ${APACHE_LOG_DIR}/linkora_web_access.log combined
</VirtualHost>

# ------------------------------------------------------------------------------
# 2. REST API GATEWAY: api.linkora.co.tz (and alias api.linkola.co.tz)
# ------------------------------------------------------------------------------
<VirtualHost *:80>
    ServerName api.linkora.co.tz
    ServerAlias api.linkola.co.tz
    ServerAdmin admin@linkora.co.tz

    DocumentRoot /var/www/html/marketlink-pro/backend/public

    <Directory /var/www/html/marketlink-pro/backend/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # CORS Headers for Mobile App & External Services
        Header always set Access-Control-Allow-Origin "*"
        Header always set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
        Header always set Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-User-Id"
        Header always set Access-Control-Expose-Headers "Content-Length,Content-Range"
    </Directory>

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/linkora_api_error.log
    CustomLog ${APACHE_LOG_DIR}/linkora_api_access.log combined
</VirtualHost>
