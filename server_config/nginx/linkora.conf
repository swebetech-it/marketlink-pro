# ==============================================================================
# Linkora Production Nginx Configuration
# Domains: linkora.co.tz, www.linkora.co.tz (Landing Page & Web Portal)
#          api.linkora.co.tz, api.linkola.co.tz (REST API Gateway)
# Server: Swebetech-IT-Solutions
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. API GATEWAY: api.linkora.co.tz (and alias api.linkola.co.tz)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.linkora.co.tz api.linkola.co.tz;

    # Redirect plain HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.linkora.co.tz api.linkola.co.tz;

    root /var/www/linkora/public;
    index index.php index.html;

    # SSL Certificates (Generated by Certbot)
    # certbot --nginx -d api.linkora.co.tz -d api.linkola.co.tz
    ssl_certificate /etc/letsencrypt/live/api.linkora.co.tz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.linkora.co.tz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security & Performance Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # CORS Headers for Mobile Apps & Web Clients
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-User-Id' always;
    add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

    client_max_body_size 64M;

    # Logging
    access_log /var/log/nginx/linkora_api_access.log;
    error_log /var/log/nginx/linkora_api_error.log;

    # Preflight OPTIONS handling
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Pass PHP scripts to FastCGI (PHP-FPM)
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        # Update socket path if your server uses php8.1, php8.2, php8.3 or php8.4
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 180;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

# ------------------------------------------------------------------------------
# 2. MAIN WEB & LANDING PAGE: linkora.co.tz & www.linkora.co.tz
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name linkora.co.tz www.linkora.co.tz;

    # Redirect plain HTTP to HTTPS
    return 301 https://linkora.co.tz$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.linkora.co.tz;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/linkora.co.tz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/linkora.co.tz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Canonical redirect www to apex domain
    return 301 https://linkora.co.tz$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name linkora.co.tz;

    root /var/www/linkora/public;
    index index.php index.html;

    # SSL Certificates (Generated by Certbot)
    # certbot --nginx -d linkora.co.tz -d www.linkora.co.tz
    ssl_certificate /etc/letsencrypt/live/linkora.co.tz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/linkora.co.tz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Upload size for APKs and files
    client_max_body_size 64M;

    # Compression for fast mobile loading in East Africa
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json;
    gzip_disable "MSIE [1-6]\.";

    # Logging
    access_log /var/log/nginx/linkora_web_access.log;
    error_log /var/log/nginx/linkora_web_error.log;

    # Fast direct APK downloads with proper binary MIME headers
    location ^~ /downloads/ {
        alias /var/www/linkora/public/downloads/;
        types {
            application/vnd.android.package-archive apk;
        }
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment; filename=linkora.apk";
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Static assets caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri $uri/ /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM execution
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 180;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
